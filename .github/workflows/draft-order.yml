name: Generate Draft Order

on:
  push:
    branches: [ main, master ]
    paths:
      - 'data/players.csv'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'data/players.csv'

jobs:
  generate-draft-order:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
        
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
      
    - name: Generate deterministic seed
      id: seed
      run: |
        # Get commit hash and current timestamp
        COMMIT_HASH="${{ github.sha }}"
        TIMESTAMP=$(date +%s)
        
        # Create a deterministic seed by combining commit hash and timestamp
        # Convert commit hash to decimal and add timestamp
        HASH_DECIMAL=$(printf "%d" "0x${COMMIT_HASH:0:8}")
        SEED=$((HASH_DECIMAL + TIMESTAMP))
        
        echo "Commit Hash: $COMMIT_HASH"
        echo "Timestamp: $TIMESTAMP"
        echo "Hash (decimal): $HASH_DECIMAL"
        echo "Generated Seed: $SEED"
        
        echo "seed=$SEED" >> $GITHUB_OUTPUT
        echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
        echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
        
    - name: Run draft order generation
      run: |
        echo "=== DRAFT ORDER GENERATION ==="
        echo "Commit Hash: ${{ steps.seed.outputs.commit_hash }}"
        echo "Runtime Timestamp: ${{ steps.seed.outputs.timestamp }}"
        echo "Generated Seed: ${{ steps.seed.outputs.seed }}"
        echo "================================"
        
        poetry run python draft_order.py --seed ${{ steps.seed.outputs.seed }}
        
    - name: Commit draft order changes
      if: github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/draft_order.csv
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-generate draft order from players.csv changes [skip ci]"
          git push
        fi 