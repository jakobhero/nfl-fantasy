name: Generate Draft Order

# the draw only runs once the roster has landed on main, so a pull request
# cannot preview the order it would produce
on:
  push:
    branches: [ main, master ]
    paths:
      - 'data/players.csv'

# the repository default for the workflow token is read-only, which makes the
# git push in the commit step fail fatally with exit code 128
permissions:
  contents: write

jobs:
  generate-draft-order:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true

    # provisions the Python pinned in .python-version and the locked dependencies
    - name: Install dependencies
      run: uv sync --locked


    - name: Generate deterministic seed
      id: seed
      run: |
        # Get commit hash and current timestamp
        COMMIT_HASH="${{ github.sha }}"
        TIMESTAMP=$(date +%s)
        
        # Create a deterministic seed by combining commit hash and timestamp
        # Convert commit hash to decimal and add timestamp
        HASH_DECIMAL=$(printf "%d" "0x${COMMIT_HASH:0:8}")
        SEED=$((HASH_DECIMAL + TIMESTAMP))
        
        echo "Commit Hash: $COMMIT_HASH"
        echo "Timestamp: $TIMESTAMP"
        echo "Hash (decimal): $HASH_DECIMAL"
        echo "Generated Seed: $SEED"
        
        echo "seed=$SEED" >> $GITHUB_OUTPUT
        echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
        echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
        
    - name: Run draft order generation
      run: |
        echo "=== DRAFT ORDER GENERATION ==="
        echo "Commit Hash: ${{ steps.seed.outputs.commit_hash }}"
        echo "Runtime Timestamp: ${{ steps.seed.outputs.timestamp }}"
        echo "Generated Seed: ${{ steps.seed.outputs.seed }}"
        echo "================================"
        
        uv run python draft_order.py --seed ${{ steps.seed.outputs.seed }}

    - name: Record season seed
      run: |
        # persist the seed so the division and schedule draws can be run locally
        # against the exact same season seed, without copying it out of these logs
        echo "${{ steps.seed.outputs.seed }}" > data/seed.txt
        cat data/seed.txt

    - name: Commit draft order changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/draft_order.csv data/seed.txt
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-generate draft order from players.csv changes [skip ci]"
          git push
        fi 