name: Generate Draft Order

# the draw is deliberately not coupled to a file changing: a roster edit made for
# any other reason must not redraw the order. it runs when a pull request carrying
# the draw-order label is merged, so the draw is always something someone asked for
on:
  pull_request:
    types: [closed]

# the repository default for the workflow token is read-only, which makes the
# git push in the commit step fail fatally with exit code 128
permissions:
  contents: write

jobs:
  generate-draft-order:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'draw-order')

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # a closed pull request points github.ref at the merge ref, which cannot be
        # pushed to, so check out the branch the pull request was merged into
        ref: ${{ github.event.pull_request.base.ref }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true

    # provisions the Python pinned in .python-version and the locked dependencies
    - name: Install dependencies
      run: uv sync --locked


    - name: Generate deterministic seed
      id: seed
      run: |
        # Get commit hash and current timestamp
        COMMIT_HASH="${{ github.sha }}"
        TIMESTAMP=$(date +%s)
        
        # Create a deterministic seed by combining commit hash and timestamp
        # Convert commit hash to decimal and add timestamp
        HASH_DECIMAL=$(printf "%d" "0x${COMMIT_HASH:0:8}")
        SEED=$((HASH_DECIMAL + TIMESTAMP))
        
        echo "Commit Hash: $COMMIT_HASH"
        echo "Timestamp: $TIMESTAMP"
        echo "Hash (decimal): $HASH_DECIMAL"
        echo "Generated Seed: $SEED"
        
        echo "seed=$SEED" >> $GITHUB_OUTPUT
        echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
        echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
        
    - name: Run draft order generation
      run: |
        echo "=== DRAFT ORDER GENERATION ==="
        echo "Commit Hash: ${{ steps.seed.outputs.commit_hash }}"
        echo "Runtime Timestamp: ${{ steps.seed.outputs.timestamp }}"
        echo "Generated Seed: ${{ steps.seed.outputs.seed }}"
        echo "================================"
        
        # the script records the seed alongside the order it produced, and refuses to
        # overwrite a season that has already been drawn
        uv run python draft_order.py --seed ${{ steps.seed.outputs.seed }}

    - name: Commit draft order changes
      run: |
        SEASON=$(cat data/season.txt)
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "data/$SEASON"
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Draw draft order for the $SEASON season [skip ci]"
          git push
        fi 