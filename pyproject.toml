[tool.poetry]
name = "nfl-fantasy"
version = "0.1.0"
description = "Scripts to draw draft order, divisions, and schedule for NFL fantasy"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
numpy = "2.0.1"
pandas = "2.2.2"
python-dateutil = "2.9.0.post0"
pytz = "2024.1"
six = "1.16.0"
tzdata = "2024.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"] 