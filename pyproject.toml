[project]
name = "nfl-fantasy"
version = "0.1.0"
description = "Scripts to draw draft order, divisions, and schedule for NFL fantasy"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=25.0.0",
    "flake8>=7.0.0",
]

# the repository is a set of scripts, not an installable package, so uv only has
# to provision the dependencies
[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
